# GitHub Pages가 release 루트를 Jekyll로 처리할 때 소스·내부 문서·개발 도구 파일은 배포 사이트에 올리지 않는다.
# .astro 파일이 `---`로 시작해 Jekyll이 YAML 머리말로 오인하는 것도 막는다.
# 사이트 산출물(루트의 html/xml/json/css/js/images/font 등)은 그대로 서빙된다.
# Jekyll 3.10은 패턴을 루트 기준 접두사로도 비교한다(`public`은 `publicity.html`도 제외, `images/public/`은 영향 없음).
# 산출물 이름과 겹치지 않는지 tests/pages-exclude.test.js와 npm run test:integration이 확인한다.
# CNAME은 커스텀 도메인 설정 파일이라 기존처럼 배포에 남긴다. 점(.)으로 시작하는 파일은 Jekyll이 기본으로 건너뛴다.
exclude:
  - src
  - content
  - public
  - assets
  - scripts
  - tests
  - node_modules
  - package.json
  - package-lock.json
  - astro.config.mjs
  - tsconfig.json
  - Makefile
  - AGENTS.md
  - README.md
